networks:
  spharos:
    name: spharos
    driver: bridge

services:
  mysql:
    image: mysql:8.0
    container_name: mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: "1234"
      MYSQL_DATABASE: product
    ports:
      - "3306:3306"
    networks:
      - spharos
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p1234"]
      interval: 10s
      timeout: 5s
      retries: 5

  eureka:
    build:
      context: ./eureka
      dockerfile: Dockerfile
    container_name: eureka
    restart: always
    ports:
      - "8761:8761"
    networks:
      - spharos

  gateway:
    build:
      context: ./gateway
      dockerfile: Dockerfile
    container_name: gateway
    restart: always
    ports:
      - "8000:8000"
    depends_on:
      - eureka
    networks:
      - spharos

  member-service:
    build:
      context: ./member-service
      dockerfile: Dockerfile
    container_name: member-service
    restart: always
    environment:
      SERVER_PORT: 8080
    ports:
      - "8080:8080"
    depends_on:
      - eureka
      - mysql
    networks:
      - spharos
