server:
  port: 8000

spring:
  application:
    name: gateway
  cloud:
    gateway:
      server:
        webflux:
          discovery:
            locator:
              enabled: true
              lower-case-service-id: true
          routes:
            - id: member-service
              uri: lb://member-service
              predicates:
                - Path=/member-service/**
              filters:
                - StripPrefix=1

eureka:
  client:
    service-url:
      defaultZone: http://eureka:8761/eureka/
  instance:
    prefer-ip-address: true

# UI는 직접 구성하고, springdoc 기본 UI/Petstore 는 비활성화
springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false
