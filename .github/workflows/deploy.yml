name: Eureka Server CI/CD

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: self-hosted
    defaults:
      run:
        shell: cmd

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Build with Gradle
        run: gradlew.bat bootJar -x test --no-daemon

      - name: Prepare Docker Network and Clean Existing Container
        run: |
          docker network create spharos 2>nul
          docker rm -f eureka 2>nul
          exit /b 0

      - name: Deploy Eureka with Docker Compose
        run: docker compose up -d --build

      - name: Verify Running Container
        run: docker compose ps
