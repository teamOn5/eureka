name: User Service CI/CD

on:
  push:
    branches: [main]

jobs:
  build-and-deploy:
    runs-on: self-hosted

    defaults:
      run:
        shell: cmd

    steps:
      # 1. 소스코드 가져오기
      - name: Checkout
        uses: actions/checkout@v4

      # 2. JDK 설정
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # 3. Gradle Wrapper 확인
      - name: Check Gradle Wrapper
        run: dir gradlew.bat

      # 4. Gradle 빌드
      - name: Build with Gradle
        run: .\gradlew.bat bootJar --no-daemon

      # 5. Docker 이미지 생성
      - name: Build Docker Image
        run: docker build -t user-service:latest .

      # 6. 기존 컨테이너 종료 및 삭제
      - name: Stop existing container
        run: |
          docker stop user-service 2>nul
          docker rm user-service 2>nul
          exit /b 0

      # 7. Docker 컨테이너 실행
      - name: Run Docker Container
        run: docker run -d --name user-service -p 8081:8081 --network spharos user-service:latest
