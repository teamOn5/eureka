name: User Service CI/CD

on:
push:
branches: [main]

jobs:
build-and-deploy:
runs-on: self-hosted
defaults:
run:
shell: cmd

steps:
- name: Checkout
uses: actions/checkout@v4

- name: Set up JDK 17
uses: actions/setup-java@v4
with:
distribution: temurin
java-version: "17"

- name: Build with Gradle
run: gradlew.bat bootJar --no-daemon

- name: Build Docker Image
run: docker build -t user-service:latest .

- name: Stop existing container
run: |
docker stop user-service 2>nul
docker rm user-service 2>nul
exit /b 0

- name: Run Docker Container
run: |
docker run -d --name user-service -p 8081:8081 --network spharos user-service:latest
